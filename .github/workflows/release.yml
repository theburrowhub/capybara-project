name: Godot desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag
        required: true
        default: v0.3.0

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          curl --fail --location --output godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --output export_templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip -d godot-bin
          sudo install "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          unzip -q export_templates.tpz -d template-unpack
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp template-unpack/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Validate
        run: |
          godot --headless --editor --path . --quit
          godot --headless --path . --scene res://tests/smoke_test.tscn

      - name: Export desktop builds
        run: |
          mkdir -p build/linux build/windows build/macos artifacts
          godot --headless --path . --export-release "Linux" build/linux/CapybaraProject.x86_64
          godot --headless --path . --export-release "Windows Desktop" build/windows/CapybaraProject.exe
          godot --headless --path . --export-release "macOS" build/macos/CapybaraProject.zip
          cp README.md build/linux/
          cp README.md build/windows/
          tar -C build/linux -czf artifacts/capybara-project-linux-x86_64.tar.gz .
          (cd build/windows && zip -q -r ../../artifacts/capybara-project-windows-x86_64.zip .)
          cp build/macos/CapybaraProject.zip artifacts/capybara-project-macos-universal.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          gh release view "$VERSION" >/dev/null 2>&1 || \
            gh release create "$VERSION" --title "Capybara Project $VERSION" --generate-notes
          gh release upload "$VERSION" artifacts/* --clobber
