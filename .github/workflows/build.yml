name: Godot validation

on:
  pull_request:
    branches: [main-godot, main]
  push:
    branches: [main-godot]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl --fail --location --output godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          sudo install "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Import and parse project
        run: godot --headless --editor --path . --quit

      - name: Run gameplay smoke test
        run: godot --headless --path . --scene res://tests/smoke_test.tscn

